<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happiest Birthday, Annayya â¤ï¸</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&family=Sacramento&display=swap" rel="stylesheet"><style>
:root{--c:#f7f1e7;--p:#fffaf2;--g:#24443b;--g2:#18352e;--t:#b86d50;--a:#b18b54;--i:#292b28}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--c);color:var(--i);font-family:DM Sans,sans-serir}h1,h2,h3{font-family:Cormorant Garamond,serif;line-height:.95}section{min-height:100vh;padding:90px 6vw;display:grid;place-items:center}.script{font-family:Sacramento,cursive}.btn{display:inline-block;padding:13px 22px;border:1px solid #ffffff66;border-radius:999px;background:#fff9;color:inherit;text-decoration:none;cursor:pointer}.wrap{width:min(1100px,94vw);margin:auto}.fade{opacity:0;transform:translateY(25px);transition:.9s}.fade.on{opacity:1;transform:none}.ey{letter-spacing:.2em;text-transform:uppercase;font-size:.7rem;color:var(--t)}
#home{text-align:center;background:radial-gradient(circle at 20% 20%,#b18b5420,transparent 28%),radial-gradient(circle at 80% 80%,#b86d5020,transparent 28%),var(--c)}#home:before{content:"";position:absolute;inset:22px;border:1px solid #24443b25}#home h1{font-size:clamp(4rem,10vw,8rem);color:var(--g);margin:25px 0 8px}#home .lines{font:clamp(1.7rem,4vw,3rem) Cormorant Garamond,serif;line-height:1.05}#home .lines span{display:block}.sub{max-width:600px;margin:20px auto 35px;line-height:1.7;color:#6f7068}
#hero{background:var(--g);color:var(--p)}.hero{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.hero img,.memory img,.final img{width:100%;display:block;background:#eee4d6;padding:10px;box-shadow:0 20px 50px #0002;object-fit:contain}.hero h2{font-size:clamp(3.5rem,7vw,6rem);margin:20px 0}.hero p{font:1.5rem Cormorant Garamond,serif;line-height:1.45;color:#eee6da}
#memories{display:block;padding-top:130px}.head{text-align:center;margin-bottom:70px}.head h2{font-size:clamp(3.5rem,7vw,6rem);color:var(--g);margin:15px 0}.head p{color:#6f7068}.memory{min-height:85vh;display:grid;grid-template-columns:.8fr 1.2fr;gap:65px;align-items:center;margin:0 auto 100px}.memory:nth-child(even){grid-template-columns:1.2fr .8fr}.memory:nth-child(even) .copy{order:2}.memory:nth-child(even) .pic{order:1}.copy h3{font-size:clamp(3rem,6vw,5.5rem);color:var(--g);margin:12px 0 20px}.remember{font:2.2rem Sacramento,cursive;color:var(--t)}.copy p{font:1.4rem Cormorant Garamond,serif;line-height:1.5;max-width:450px}.pic{position:relative}.tag{position:absolute;right:20px;bottom:-18px;background:var(--p);padding:12px 20px;font:1.5rem Sacramento,cursive;box-shadow:0 8px 20px #0002}
#reveal,#final{background:var(--g2);color:var(--p);text-align:center}.reveal img{width:min(700px,94vw);margin:35px auto;border:10px solid var(--p);display:none}.reveal img.show{display:block;animation:up 1s}.reveal h2{font-size:clamp(3rem,7vw,6rem);color:#f0ddbb}.reveal .script{font-size:3rem}.hidden{display:none!important}@keyframes up{from{opacity:0;transform:scale(.93) translateY(20px)}to{opacity:1;transform:none}}
#gift,#letter{background:#eadfce;text-align:center}#gift h2,#letter h2,#cake h2{font-size:clamp(3.5rem,7vw,6rem);color:var(--g)}.gift{width:160px;height:130px;margin:45px auto;position:relative;cursor:pointer}.box{position:absolute;bottom:0;left:10px;right:10px;height:95px;background:var(--t);border-radius:6px}.lid{position:absolute;top:18px;left:0;right:0;height:32px;background:#9d5941;border-radius:5px}.rv{position:absolute;top:18px;bottom:0;left:69px;width:22px;background:var(--a)}.rh{position:absolute;top:29px;left:0;right:0;height:12px;background:var(--a)}.msg,.letterbody{max-width:650px;margin:auto;background:var(--p);padding:30px;line-height:1.7;display:none}.show{display:block!important;animation:up .7s}.letterbody{font:1.25rem Cormorant Garamond,serif;text-align:left;white-space:pre-line}.letterbody p{margin:0}.letterbody .sign{margin-top:24px;text-align:right;font-family:Sacramento,cursive;font-size:2rem;color:var(--g)}
